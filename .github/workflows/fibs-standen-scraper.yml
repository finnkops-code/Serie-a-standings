name: FIBS Serie A Gold Standen Scraper
on:
  schedule:
    # 04:00 UTC = 06:00 CEST (zomertijd) / 05:00 CET (wintertijd) — ruim na
    # afloop van de avondwedstrijden in Italië.
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Playwright installeren
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Standen scrapen
        run: python fibs_scraper.py
      - name: Debug-bestanden uploaden bij mislukking
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fibs-debug
          path: |
            debug_screenshot.png
            debug_page.html
          if-no-files-found: ignore
      - name: JSON bestand committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add standen_serie_a_gold.json
          git diff --staged --quiet || git commit -m "FIBS Serie A Gold standen bijgewerkt: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
