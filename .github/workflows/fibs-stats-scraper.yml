name: FIBS Serie A Gold Stats Scraper
on:
  schedule:
    # 04:00 UTC = 06:00 CEST (zomertijd) / 05:00 CET (wintertijd) — ruim na
    # afloop van de avondwedstrijden in Italië, zelfde moment als de
    # standen-scraper.
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Statistieken scrapen
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python fibs_stats_scraper.py
      - name: JSON bestand committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats_serie_a_gold.json
          git diff --staged --quiet || git commit -m "FIBS Serie A Gold stats bijgewerkt: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
